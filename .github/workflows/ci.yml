name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Check formatting
        run: npx prettier --check "src/**/*.{vue,ts,js,css}"

      - name: Type check
        run: npx vue-tsc -b --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npx vite build
